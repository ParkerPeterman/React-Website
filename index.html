    <!-- Resolve the theme before first paint: a stored choice wins, otherwise
         follow the OS. 'light' is paper, 'dark' is blueprint. Running this in
         <head> avoids a flash of the wrong drawing style. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          if (theme === 'dark') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1B3D6E');
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
